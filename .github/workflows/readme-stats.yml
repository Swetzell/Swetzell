name: Actualizar estadísticas del README

on:
  schedule:
    - cron: "17 11 * * *" # todos los días, ~6:17 a. m. hora de Lima
  workflow_dispatch: # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  tarjetas:
    runs-on: ubuntu-latest
    env:
      # Fondo transparente y colores legibles en modo claro y oscuro
      ESTILO: theme=transparent&hide_border=true&title_color=2F81F7&icon_color=2F81F7&text_color=6E7781&locale=es&disable_animations=true
    steps:
      - uses: actions/checkout@v6

      - name: Tarjeta de estadísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&hide_rank=true&hide=issues&${{ env.ESTILO }}
          path: profile/stats.svg
          # Sin el secreto STATS_TOKEN usa el token por defecto: datos públicos + conteo de contribuciones privadas.
          # Con STATS_TOKEN (PAT con scopes repo y read:user) también cuenta tus PRs en repos privados.
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Tarjeta de lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=html,css&${{ env.ESTILO }}
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Guardar tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Actualiza estadísticas del README" || exit 0
          git push
