name: Actualizar estadísticas del README

on:
  schedule:
    - cron: "17 11 * * *" # todos los días, ~6:17 a. m. hora de Lima
  workflow_dispatch: # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  tarjetas:
    runs-on: ubuntu-latest
    env:
      # Fondo transparente y colores legibles en modo claro y oscuro
      ESTILO: show_icons=true&hide_rank=true&hide_border=true&theme=transparent&title_color=2F81F7&icon_color=2F81F7&text_color=6E7781&disable_animations=true
      # Los secretos no se pueden usar directo en "if", por eso se pasan a esta variable
      CON_TOKEN: ${{ secrets.STATS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6

      # Sin STATS_TOKEN: solo "Total Contributions" de todos los años. Incluye tus contribuciones
      # privadas porque activaste "Include private contributions on my profile".
      - name: Estadísticas (sin token)
        if: env.CON_TOKEN != 'true'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show=contributions&hide=stars,commits,prs,issues,contribs&${{ env.ESTILO }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Con STATS_TOKEN (PAT clásico con scopes repo y read:user): commits, PRs y reviews
      # también cuentan lo que haces en repos privados.
      - name: Estadísticas (con token)
        if: env.CON_TOKEN == 'true'
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show=contributions,reviews,prs_merged&hide=stars,issues,contribs&${{ env.ESTILO }}
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Guardar tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch profile/top-langs.svg
          git add profile/stats.svg
          git commit -m "Actualiza estadísticas del README" || exit 0
          git push
